spring:
  application:
    name: booking-application
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/booking-realm
          # Add JWK set URI for faster startup (optional but recommended)
          jwk-set-uri: http://localhost:8080/realms/booking-realm/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microbookings}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: 8085

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    booking.bookingapplication: DEBUG
    org.springframework.security: DEBUG

# Scheduler configuration
booking:
  scheduler:
    expiry-check-cron: "0 */1 * * * *"  # Every 1 minute
  pricing:
    default-seat-price: 200.00
    tax-rate: 0.18
  expiry:
    timeout-minutes: 10

aws:
  accessKeyId: fake-key
  secretAccessKey: fake-secret
  region: us-east-1
  s3:
    bucket-name: booking-bucket
