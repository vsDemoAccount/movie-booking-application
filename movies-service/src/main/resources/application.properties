spring.application.name=movies-service

# movies-service/src/main/resources/application.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/microMovies
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
server.port=8080

# change temporarily (development only)
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# language: properties
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# properties
#springdoc.server-url=http://localhost:8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true