server:
  port: 8080

spring:
  application:
    name: movies-service

  datasource:
    url: jdbc:postgresql://localhost:5432/microMovies
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Make sure this class path is EXACTLY correct
        spring.json.type.mapping: movie_event:movies.moviesservice.dtos.MovieCreatedEvent_kfk.MovieCreatedEvent