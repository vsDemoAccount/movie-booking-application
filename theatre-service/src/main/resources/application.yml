server:
  port: 8083

spring:
  application:
    name: theatre-service


  datasource:
    url: jdbc:postgresql://localhost:5432/microtheatre
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  kafka:
    # --- FIX 1: ADDED BOOTSTRAP SERVERS ---
    bootstrap-servers: localhost:9092

    consumer:
      group-id: theatre-service-group-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

        # --- FIX 2: CHECK THIS PATH CAREFULLY ---
        # Right-click your 'MovieCreatedEvent.java' file in IntelliJ -> "Copy Reference"
        # and paste it here if it is different.
        spring.json.value.default.type: movies.theatreservice.dtos.MovieCreatedEvent

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
